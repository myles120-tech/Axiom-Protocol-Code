<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64" role="img" aria-label="Nova Rifle weapon sprite">
  <defs>
    <linearGradient id="bodyGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#c8fbff"/>
      <stop offset="100%" stop-color="#5ae7ff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f2a3b"/>
      <stop offset="100%" stop-color="#09111d"/>
    </linearGradient>
  </defs>

  <rect width="128" height="64" fill="transparent"/>

  <!-- rear stock -->
  <rect x="4" y="22" width="18" height="18" fill="#0f1729"/>
  <rect x="10" y="18" width="14" height="8" fill="#1c2943"/>
  <rect x="18" y="25" width="6" height="8" fill="#5ae7ff" opacity="0.9"/>

  <!-- body -->
  <rect x="20" y="16" width="44" height="30" rx="3" fill="url(#metal)"/>
  <rect x="30" y="20" width="22" height="22" fill="#1d2f4b"/>
  <rect x="32" y="22" width="18" height="18" fill="url(#bodyGlow)" opacity="0.9"/>

  <!-- muzzle / barrel -->
  <rect x="64" y="20" width="38" height="22" fill="#0d1828"/>
  <rect x="72" y="24" width="30" height="14" fill="#7deaff" opacity="0.9"/>
  <rect x="101" y="24" width="8" height="14" fill="#dffcff" opacity="0.8"/>

  <!-- top rail -->
  <rect x="26" y="12" width="54" height="6" fill="#6e8db7"/>
  <rect x="34" y="8" width="20" height="6" fill="#a9d9ff"/>

  <!-- accent vents -->
  <rect x="60" y="18" width="4" height="24" fill="#8cecff" opacity="0.8"/>
  <rect x="44" y="16" width="4" height="26" fill="#8cecff" opacity="0.7"/>
  <rect x="52" y="16" width="4" height="26" fill="#8cecff" opacity="0.7"/>

  <!-- muzzle flash -->
  <path d="M101 24 l14 -6 v6 l-14 6 z" fill="#9ef6ff" opacity="0.9"/>
  <path d="M101 38 l14 6 v-6 l-14 -6 z" fill="#aef4ff" opacity="0.7"/>

  <!-- underbarrel grip -->
  <rect x="24" y="40" width="16" height="12" fill="#0c1525"/>
  <rect x="28" y="44" width="8" height="8" fill="#5ae7ff" opacity="0.75"/>

  <!-- tiny details for pixel style -->
  <rect x="38" y="28" width="3" height="3" fill="#0c1322"/>
  <rect x="44" y="28" width="3" height="3" fill="#0c1322"/>
  <rect x="50" y="28" width="3" height="3" fill="#0c1322"/>
  <rect x="80" y="21" width="3" height="3" fill="#dffcff"/>
  <rect x="88" y="21" width="3" height="3" fill="#dffcff"/>
</svg>
