<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AXIOM PROTOCOL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&family=Press+Start+2P&display=swap');
  :root{ --cyan:#28e6ff; --mag:#ff2e88; --gold:#ffd24a; --bg:#05060e; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Rajdhani',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(1200px 700px at 50% 40%, #0b1030 0%, #05060e 70%);}
  #frame{position:relative; box-shadow:0 0 0 1px #1a2348, 0 0 60px rgba(40,230,255,.12), 0 30px 90px rgba(0,0,0,.8); border-radius:6px; overflow:hidden;
    width:min(100vw, calc(100vh * 960 / 544), 960px); aspect-ratio:960/544;}
  canvas{display:block;image-rendering:pixelated;background:#000;width:100%;height:100%}
  /* CRT overlay */
  #crt{display:none;position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);}
  #vig{display:none;position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);}
  #hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#5b6aa0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  #hint b{color:#9fb4ff}
  /* ---- touch controls ---- */
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:50;
    font-family:'Orbitron',sans-serif;-webkit-user-select:none;user-select:none}
  body.touchmode #touch{display:block}
  body.touchmode #hint{display:none}
  .tbtn{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:#cfeeff;background:rgba(12,18,44,.5);border:1.5px solid rgba(120,150,255,.45);border-radius:14px;
    font-weight:700;letter-spacing:.06em;backdrop-filter:blur(2px);-webkit-tap-highlight-color:transparent}
  .tbtn.active{background:rgba(40,230,255,.35);border-color:#28e6ff;color:#fff}
  body.touchmode #bU, body.touchmode #bDN{display:none}
  body.touchmode.gridnav #bU, body.touchmode.gridnav #bDN{display:flex}
  #bU{left:13vw;bottom:21vh;width:14vw;height:12vw;max-width:80px;max-height:66px;font-size:22px;border-color:rgba(120,150,255,.5)}
  #bL{left:1vw;bottom:9vh;width:15vw;height:15vw;max-width:88px;max-height:88px;font-size:28px}
  #bR{left:21vw;bottom:9vh;width:15vw;height:15vw;max-width:88px;max-height:88px;font-size:28px}
  #bDN{left:13vw;bottom:1vh;width:14vw;height:12vw;max-width:80px;max-height:66px;font-size:22px;border-color:rgba(120,150,255,.5)}
  #bJ{right:3vw;bottom:17vh;width:17vw;height:17vw;max-width:96px;max-height:96px;border-radius:50%;font-size:15px;border-color:rgba(40,230,255,.6)}
  #bF{right:22vw;bottom:5vh;width:17vw;height:17vw;max-width:96px;max-height:96px;border-radius:50%;font-size:15px;border-color:rgba(255,46,136,.6)}
  #bD{right:3vw;bottom:2vh;width:13vw;height:11vw;max-width:78px;max-height:64px;font-size:13px;border-color:rgba(255,210,74,.55)}
  #bS{left:50%;transform:translateX(-50%);top:2vh;width:108px;height:38px;font-size:12px}
  #bW{right:3vw;top:2vh;width:64px;height:38px;font-size:12px}
  #bX{left:3vw;top:2vh;width:64px;height:38px;font-size:12px;border-color:rgba(255,93,93,.5)}
  #rotate{display:none;position:fixed;inset:0;z-index:99;background:#05060e;color:#9fb4ff;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;
    font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:.1em;padding:24px}
  #rotate .ph{width:46px;height:78px;border:3px solid #28e6ff;border-radius:8px;animation:rot 1.6s ease-in-out infinite}
  #rotate .skip{margin-top:10px;padding:10px 20px;border:1.5px solid #ff2e88;border-radius:10px;color:#ffd2e6;font-size:13px}
  @keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  body.show-rotate #rotate{display:flex}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="cv" width="960" height="544"></canvas>
    <div id="crt"></div><div id="vig"></div>
  </div>
</div>
<div id="hint"><b>D-Pad / ←→</b> move &nbsp; <b>✕ / Z</b> jump &nbsp; <b>▢ / X</b> fire·charge &nbsp; <b>◯ / C</b> dash &nbsp; <b>L·R / A·S</b> weapon &nbsp; <b>START</b> confirm·pause</div>
<div id="touch">
  <div class="tbtn" id="bU" data-k="U">▲</div>
  <div class="tbtn" id="bL" data-k="L">◀</div>
  <div class="tbtn" id="bR" data-k="R">▶</div>
  <div class="tbtn" id="bDN" data-k="D">▼</div>
  <div class="tbtn" id="bJ" data-k="J">JUMP</div>
  <div class="tbtn" id="bF" data-k="F">FIRE</div>
  <div class="tbtn" id="bD" data-k="DS">DASH</div>
  <div class="tbtn" id="bS" data-k="OK">START</div>
  <div class="tbtn" id="bW" data-k="WR">WPN</div>
  <div class="tbtn" id="bX" data-k="ESC">EXIT</div>
</div>
<div id="rotate"><div class="ph"></div>ROTATE TO LANDSCAPE<br>for the full view<div class="skip" id="skipRotate">PLAY ANYWAY ▶</div></div>
<script>
'use strict';
/* ============================================================
   AXIOM PROTOCOL — a love letter to 16-bit hunter platformers
   Original characters & world. Canvas, zero dependencies.
   ============================================================ */
const W = 960, H = 544;
/* ============================================================
   16-BIT PIXEL RENDERER (High-End Edition)
   The whole game draws into a half-resolution 480x272 buffer that is
   scaled up 2x with nearest-neighbour, so every shape becomes chunky
   pixels. Sprites draw on their own layer and get a 1px dark outline.
   Glow (shadowBlur) is disabled for a clean, flat palette look.
   Text is replayed on the full-res canvas in a pixel font so it stays
   sharp and readable.
   ============================================================ */
const PX = 2;                                   /* pixel scale */
const CV = document.getElementById('cv'), MAIN = CV.getContext('2d');
MAIN.imageSmoothingEnabled = false;
const OUTLINE = '#0b0614';
const SPR_SCALE = 1.3;   /* hero sprites drawn larger than their hitbox, like 16-bit action games */
const TXT = [];                                  /* queued text for full-res replay */
function pixFont(f){
  if(/Press Start/.test(f))return f;
  const m=/(\d+(?:\.\d+)?)px/.exec(f||''); const s=m?parseFloat(m[1]):12;
  let ps=Math.round(s*0.6); if(ps>=32)ps=Math.round(ps/8)*8; ps=Math.max(8,ps);
  return ps+"px 'Press Start 2P', monospace";
}
function getM(ctx){ const m=ctx.getTransform?ctx.getTransform():null;
  return m&&typeof m.a==='number'?m:{a:1/PX,b:0,c:0,d:1/PX,e:0,f:0}; }
function mkLayer(){
  const c=document.createElement('canvas'); c.width=W/PX; c.height=H/PX;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  /* flat look: no glow */
  try{Object.defineProperty(x,'shadowBlur',{get(){return 0;},set(){},configurable:true});}catch(e){}
  /* text → queued for crisp replay */
  x.fillText=function(s,tx,ty){ const m=getM(x);
    TXT.push({s:String(s),x:tx,y:ty,font:pixFont(x.font),fill:x.fillStyle,align:x.textAlign,
      base:x.textBaseline,alpha:x.globalAlpha,m:[m.a,m.b,m.c,m.d,m.e,m.f]}); };
  x.strokeText=function(){};
  /* snap solid rects to the pixel grid → hard pixel edges */
  const ofr=x.fillRect.bind(x);
  x.fillRect=function(rx,ry,rw,rh){
    if(typeof x.fillStyle!=='string'){ofr(rx,ry,rw,rh);return;}
    const m=x.getTransform?x.getTransform():null;
    if(!m||typeof m.a!=='number'||m.b!==0||m.c!==0){ofr(rx,ry,rw,rh);return;}
    let x0=Math.round(m.a*rx+m.e), x1=Math.round(m.a*(rx+rw)+m.e);
    let y0=Math.round(m.d*ry+m.f), y1=Math.round(m.d*(ry+rh)+m.f);
    if(x1<x0){const t=x0;x0=x1;x1=t;} if(y1<y0){const t=y0;y0=y1;y1=t;}
    if(x1===x0)x1++; if(y1===y0)y1++;
    x.setTransform(1,0,0,1,0,0); ofr(x0,y0,x1-x0,y1-y0); x.setTransform(m.a,m.b,m.c,m.d,m.e,m.f);
  };
  return {c,x};
}
const LO=mkLayer(), ACT=mkLayer(), SIL=mkLayer();
let CX = LO.x;
function beginPixelFrame(){
  TXT.length=0; LO.x.setTransform(1,0,0,1,0,0); LO.x.clearRect(0,0,W/PX,H/PX);
  LO.x.setTransform(1/PX,0,0,1/PX,0,0); CX=LO.x;
}
/* actor layer: everything drawn between begin/end gets a dark 1px outline */
function beginActors(){
  const m=getM(LO.x);
  ACT.x.setTransform(1,0,0,1,0,0); ACT.x.clearRect(0,0,W/PX,H/PX);
  ACT.x.setTransform(m.a,m.b,m.c,m.d,m.e,m.f); ACT.x.globalAlpha=1; CX=ACT.x;
}
function endActors(){
  const s=SIL.x;
  s.setTransform(1,0,0,1,0,0); s.globalCompositeOperation='source-over'; s.clearRect(0,0,W/PX,H/PX);
  s.drawImage(ACT.c,0,0); s.globalCompositeOperation='source-in'; s.fillStyle=OUTLINE;
  s.fillRect(0,0,W/PX,H/PX); s.globalCompositeOperation='source-over';
  const l=LO.x, m=getM(l); l.setTransform(1,0,0,1,0,0); l.globalAlpha=1;
  l.drawImage(SIL.c,-1,0); l.drawImage(SIL.c,1,0); l.drawImage(SIL.c,0,-1); l.drawImage(SIL.c,0,1);
  l.drawImage(ACT.c,0,0); l.setTransform(m.a,m.b,m.c,m.d,m.e,m.f); CX=LO.x;
}
function presentPixelFrame(){
  MAIN.setTransform(1,0,0,1,0,0); MAIN.imageSmoothingEnabled=false; MAIN.globalAlpha=1;
  MAIN.drawImage(LO.c,0,0,W,H);
  for(const t of TXT){
    MAIN.setTransform(t.m[0]*PX,t.m[1]*PX,t.m[2]*PX,t.m[3]*PX,t.m[4]*PX,t.m[5]*PX);
    MAIN.font=t.font; MAIN.textAlign=t.align||'left'; MAIN.textBaseline=t.base||'alphabetic';
    MAIN.globalAlpha=t.alpha==null?1:t.alpha;
    MAIN.fillStyle=OUTLINE; MAIN.fillText(t.s,t.x+2,t.y+2,W-8);
    try{MAIN.fillStyle=t.fill;}catch(e){MAIN.fillStyle='#fff';}
    MAIN.fillText(t.s,t.x,t.y,W-8);
  }
  MAIN.setTransform(1,0,0,1,0,0); MAIN.globalAlpha=1; TXT.length=0;
}

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const TAU=Math.PI*2;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function sRand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}}

/* ---------- input ---------- */
const Keys={}, Pressed={};
const KEYMAP={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',ArrowDown:'D',s:'D',
  z:'J',k:'J',x:'F',j:'F',c:'DS',Shift:'DS',Enter:'OK',Escape:'ESC',q:'WL',e:'WR'};
addEventListener('keydown',e=>{
  let k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(e.key==='a'||e.key==='A')k='WL'; if(e.key==='s'||e.key==='S')k='WR';
  if(e.key==='ArrowLeft')k='L'; if(e.key==='ArrowRight')k='R'; if(e.key==='ArrowUp')k='U'; if(e.key==='ArrowDown')k='D';
  if(!k)return; if(!Keys[k])Pressed[k]=true; Keys[k]=true;
  if(['L','R','U','D','J','F','DS','OK'].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>{
  let k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(e.key==='a'||e.key==='A')k='WL'; if(e.key==='s'||e.key==='S')k='WR';
  if(e.key==='ArrowLeft')k='L'; if(e.key==='ArrowRight')k='R'; if(e.key==='ArrowUp')k='U'; if(e.key==='ArrowDown')k='D';
  if(k)Keys[k]=false;
});
const tap=k=>{const v=Pressed[k];Pressed[k]=false;return v;};

/* ---------- gamepad (PS Vita physical controls / any standard pad) ---------- */
let gpState={}, gpConnected=false;
/* W3C Standard Gamepad maps the same as the Vita's face buttons:
   0:× 1:○ 2:□ 3:△ 4:L 5:R 8:SELECT 9:START 12-15:d-pad */
function pollGamepad(){
  if(!navigator.getGamepads)return;
  let gp=null; for(const p of navigator.getGamepads())if(p){gp=p;break;}
  if(!gp){gpConnected=false;return;}
  gpConnected=true;
  const bp=i=>{const b=gp.buttons[i];return !!(b&&(b.pressed||b.value>0.4));};
  const down={};
  const fb={0:'J',1:'DS',2:'F',3:'WR',4:'WL',5:'WR',8:'ESC',9:'OK'};
  for(const i in fb)down[fb[i]]=down[fb[i]]||bp(+i);
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0, dz=0.45;
  down.U=bp(12)||ay<-dz; down.D=bp(13)||ay>dz; down.L=bp(14)||ax<-dz; down.R=bp(15)||ax>dz;
  for(const k of ['J','DS','F','WR','WL','ESC','OK','U','D','L','R']){
    const v=!!down[k], was=gpState[k]||false;
    if(v&&!was){if(!Keys[k])Pressed[k]=true;Keys[k]=true;audio();}
    else if(!v&&was){Keys[k]=false;}
    else if(v){Keys[k]=true;}
    gpState[k]=v;
  }
}
addEventListener('gamepadconnected',()=>{gpConnected=true;});

/* ---------- audio ---------- */
let AC=null, MUS={timer:null,step:0,song:null,gain:null};
function audio(){ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,type='square',vol=.08,slide=0,delay=0){
  try{const ac=audio(),t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}
}
function noise(dur=.2,vol=.12,fc=800,delay=0){
  try{const ac=audio(),t=ac.currentTime+delay,n=ac.sampleRate*dur,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource();s.buffer=buf;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
  const g=ac.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);}catch(e){}
}
const SFX={
  shot:()=>tone(880,.08,'square',.06,-300),
  charge1:()=>tone(220,.3,'sawtooth',.04,400),
  bigshot:()=>{tone(440,.18,'square',.1,-200);noise(.12,.08,1400);},
  slash:()=>{noise(.08,.07,3000);tone(1200,.06,'sawtooth',.04,-600);},
  hit:()=>{tone(160,.1,'square',.09,-60);noise(.06,.06,900);},
  hurt:()=>{tone(200,.25,'sawtooth',.1,-150);noise(.15,.08,500);},
  boom:()=>{noise(.5,.2,600);tone(90,.4,'triangle',.15,-50);},
  bigboom:()=>{noise(.9,.25,400);tone(60,.8,'triangle',.2,-30);for(let i=0;i<4;i++)tone(120+i*60,.3,'square',.05,-80,i*.1);},
  jump:()=>tone(330,.12,'square',.05,160),
  dash:()=>noise(.15,.06,2200),
  pickup:()=>{tone(660,.09,'square',.07);tone(990,.12,'square',.07,0,.08);},
  tank:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.08,0,i*.09));},
  blip:()=>tone(740,.06,'square',.05),
  sel:()=>{tone(523,.08,'square',.06);tone(784,.1,'square',.06,0,.06);},
  door:()=>{noise(.5,.1,300);tone(80,.5,'sawtooth',.07,40);},
  warn:()=>{tone(440,.2,'square',.09,-220);tone(440,.2,'square',.09,-220,.25);},
};
/* ============================================================
   MUSIC ENGINE 1.1 — composed multi-section soundtrack.
   Each song: key root (MIDI), mode, tempo, chord progression per bar and a
   hand-written melody (scale degrees, 8th notes). Bass, arpeggio and drum
   parts are generated from the chords in the song's style. A look-ahead
   scheduler keeps timing tight. Boss songs gain an extra "rage" layer.
   Melody tokens: 1-7 degree, 8+ = next octave, ',' = octave down,
   '-' = hold, '.' = rest.
   ============================================================ */
const MODES={ion:[0,2,4,5,7,9,11],aeo:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],phr:[0,1,3,5,7,8,10],
  mix:[0,2,4,5,7,9,10],lyd:[0,2,4,6,7,9,11],hmin:[0,2,3,5,7,8,11],pdom:[0,1,4,5,7,8,10]};
const DRUMS={ /* 16 steps per bar: k kick, s snare, h hat, x kick+hat, o open hat, t tom */
  rock:'x.h.s.h.x.x.s.h.', drive:'x.hhs.hhx.hxs.ho', dnb:'x.h.s.hxh.x.s.hh', half:'x...h...s...h..o',
  four:'x.h.x.hox.h.x.ho', march:'x.s.x.ssx.s.x.st', tribal:'t.tkt.k.t.tkt.ks', none:'................',
  boss:'xhhhs.hxxhhxs.hh', soft:'k.......h.......', heart:'k..k............'};
const SONGS={
  title:{root:57,mode:'aeo',bpm:112,lead:'triangle',bass:'octave',arp:'up',drum:'half',
    A:{ch:[1,7,6,5],m:['1 - 3 - 5 - 8 -','7 - 5 - 6 - 5 -','4 - 6 - 8 - 9 -','7 - - - 5 - - -']},
    B:{ch:[3,6,4,5],m:['3 - 2 - 1 - 7, -','1 - 3 - 5 - - -','6 - 6 - 5 - 4 -','1 - - - 5, - - -']},order:'AAB'},
  select:{root:67,mode:'ion',bpm:126,lead:'square',bass:'walk',arp:'pulse',drum:'rock',
    A:{ch:[1,4,6,5],m:['5 . 8 . 7 5 6 .','4 . 6 . 5 3 4 .','3 . 5 . 4 2 3 .','2 - - - 5, - - -']},order:'A'},
  magma:{root:64,mode:'hmin',bpm:150,lead:'sawtooth',bass:'drive',arp:'none',drum:'drive',
    A:{ch:[1,1,6,7],m:['1 . 5 . 6 5 3 5','1 . 5 . 6 7 8 -','6 . 5 . 3 . 2 3','5 - - 3 2 1 2 -']},
    B:{ch:[4,5,6,5],m:['8 - 7 8 9 8 7 5','6 - 5 6 7 6 5 3','4 5 6 . 6 7 8 .','7 - 5 - 7 - - .']},order:'AABA'},
  cryo:{root:69,mode:'dor',bpm:108,lead:'triangle',bass:'half',arp:'up',drum:'half',
    A:{ch:[1,7,4,1],m:['5 - 8 - 7 - 5 -','6 - 5 - 3 - 2 -','5 - 8 - 9 - 10 -','9 - - - 8 - - -']},
    B:{ch:[4,7,1,1],m:['3 - 4 - 5 - 7 -','8 - 7 - 5 - 4 -','3 - 2 - 1 - 2 -','3 - - - - - . .']},order:'AAB'},
  storm:{root:62,mode:'mix',bpm:162,lead:'square',bass:'octave',arp:'pulse',drum:'dnb',
    A:{ch:[1,7,4,1],m:['1 1 5 . 4 5 . 7','8 . 7 5 4 . 5 .','1 1 5 . 4 5 . 9','8 - - - 7 - 5 -']},
    B:{ch:[4,5,7,1],m:['3 . 4 5 . 8 . 7','5 . 4 3 . 2 . 1','6 . 7 8 . 10 . 9','8 - 7 - 8 - - .']},order:'AABB'},
  bio:{root:65,mode:'lyd',bpm:124,lead:'triangle',bass:'walk',arp:'pulse',drum:'march',
    A:{ch:[1,2,3,2],m:['1 3 5 3 4 5 . 3','2 4 6 4 5 6 . 4','3 5 8 5 7 8 . 6','5 - 4 - 3 - 2 -']},
    B:{ch:[6,2,1,5],m:['8 . 7 . 6 . 5 .','6 7 8 7 6 5 4 5','3 . 4 . 5 . 6 .','5 - - - . . 5 6']},order:'AAB'},
  abyss:{root:61,mode:'aeo',bpm:92,lead:'sine',bass:'half',arp:'up',drum:'soft',
    A:{ch:[1,6,1,7],m:['1 - - - 3 - 2 -','1 - - - 7, - 5, -','1 - - - 3 - 5 -','4 - 3 - 2 - - -']},
    B:{ch:[4,7,6,5],m:['5 - 6 - 7 - 8 -','7 - 5 - 3 - - -','4 - 5 - 6 - 5 -','3 - 2 - 1 - - -']},order:'AB'},

const mtof=m=>440*Math.pow(2,(m-69)/12);
const songCache={};
function compileSong(name){
  if(songCache[name])return songCache[name];
  const S=SONGS[name]; if(!S)return null;
  const sc=MODES[S.mode], deg=(d,oct=0)=>{d=d-1;const o=Math.floor(d/7);return S.root+sc[((d%7)+7)%7]+12*(o+oct);};
  const steps=[]; /* per 16th: list of notes {m,len(16ths),w,v} and drum char */
  for(const sec of S.order){const P=S[sec];
    P.m.forEach((bar,bi)=>{
      const base=steps.length; for(let k=0;k<16;k++)steps.push({n:[],d:DRUMS[S.drum][k],a:[]});
      const toks=bar.trim().split(/\s+/);
      toks.forEach((tk,ti)=>{ if(tk==='-'||tk==='.')return;
        let oct=0; while(tk.endsWith(',')){oct--;tk=tk.slice(0,-1);}
        let len=1; while(toks[ti+len]==='-')len++;
        steps[base+ti*2].n.push({m:deg(parseInt(tk),oct),len:len*2-0.4,w:S.lead,v:.026});});
      const cr=P.ch[bi]||1, r=deg(cr,-2), ct=[deg(cr,-1),deg(cr+2,-1),deg(cr+4,-1)];
      const B=(k,m,len)=>steps[base+k].n.push({m,len,w:'triangle',v:.055});
      if(S.bass==='drive')for(let k=0;k<16;k+=2)B(k,r,1.6);
      else if(S.bass==='octave')for(let k=0;k<16;k+=2)B(k,k%4?r+12:r,1.6);
      else if(S.bass==='walk')[0,4,8,12].forEach((k,q)=>B(k,[r,deg(cr+4,-2),r+12,deg(cr+4,-2)][q],3.4));
      else if(S.bass==='half'){B(0,r,7.5);B(8,deg(cr+4,-2),7.5);}
      else if(S.bass==='sync')[0,3,6,10,12].forEach(k=>B(k,r,1.6));
      if(S.arp==='up')for(let k=0;k<16;k++)steps[base+k].a.push({m:ct[k%3]+12,len:.9,w:'square',v:.011});
      else if(S.arp==='pulse')[2,6,10,14].forEach(k=>ct.forEach(m=>steps[base+k].a.push({m:m+12,len:.8,w:'square',v:.008})));
      /* rage layer for boss songs: fast arpeggio a fifth above */
      if(S.rage)for(let k=0;k<16;k++)steps[base+k].r={m:ct[(k*2)%3]+24,len:.8,w:'square',v:.012};
    });}
  return songCache[name]={steps,bpm:S.bpm,rage:!!S.rage};
}
function playDrum(c,dl){
  if(c==='k'||c==='x')tone(150,.12,'sine',.13,-110,dl);
  if(c==='s'){noise(.12,.07,2600,dl);tone(190,.06,'triangle',.04,-60,dl);}
  if(c==='h'||c==='x')noise(.025,.016,9000,dl);
  if(c==='o')noise(.09,.02,8000,dl);
  if(c==='t')tone(110,.14,'sine',.09,-50,dl);
}
function musTick(){
  if(!AC||!MUS.data)return;
  const sg=MUS.data, bpm=sg.bpm*(MUS.rage&&sg.rage?1.08:1), sd=60/bpm/4;
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.03;
  while(MUS.next<AC.currentTime+.12){
    const st=sg.steps[MUS.step%sg.steps.length], dl=MUS.next-AC.currentTime;
    for(const n of st.n)tone(mtof(n.m),n.len*sd,n.w,n.v,0,dl);
    for(const n of st.a)tone(mtof(n.m),n.len*sd,n.w,n.v,0,dl);
    if(MUS.rage&&st.r)tone(mtof(st.r.m),st.r.len*sd,st.r.w,st.r.v,0,dl);
    playDrum(st.d,dl);
    if(MUS.rage&&sg.rage&&(MUS.step%2===1))noise(.02,.012,10000,dl);
    MUS.next+=sd;MUS.step++;
  }
}
function playSong(name){
  if(MUS.song===name)return; stopSong(); MUS.song=name; MUS.rage=false;
  const sg=compileSong(name); if(!sg)return;
  MUS.data=sg; MUS.step=0; MUS.next=AC?AC.currentTime+.05:0;
  MUS.timer=setInterval(musTick,25);
}
function stopSong(){if(MUS.timer)clearInterval(MUS.timer);MUS.timer=null;MUS.song=null;MUS.step=0;MUS.data=null;MUS.rage=false;}

let parts=[];
function spawnP(x,y,vx,vy,life,col,size=3,grav=0,glow=false,shape='sq'){

function updateParts(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.life--;
    if(p.life<=0)parts.splice(i,1);}
}
function drawParts(cam){
  for(const p of parts){const a=p.life/p.max;CX.globalAlpha=a;
    if(p.glow){CX.shadowColor=p.col;CX.shadowBlur=8;}
    CX.fillStyle=p.col;
    if(p.shape==='sq')CX.fillRect(p.x-cam.x-p.size/2,p.y-cam.y-p.size/2,p.size,p.size);
    else{CX.beginPath();CX.arc(p.x-cam.x,p.y-cam.y,p.size,0,TAU);CX.fill();}
    CX.shadowBlur=0;}
  CX.globalAlpha=1;
}

/* ---------- backgrounds ---------- */
const ambP=[];
function drawBG(def,camx){
  /* posterized 16-bit sky: flat colour bands instead of a smooth gradient */
  const BANDS=18;
  for(let b=0;b<BANDS;b++){const t=b/(BANDS-1);
    CX.fillStyle=t<.5?mixHex(def.sky[0],def.sky[1],t*2):mixHex(def.sky[1],def.sky[2],(t-.5)*2);
    CX.fillRect(0,Math.floor(b*H/BANDS/PX)*PX,W,Math.ceil(H/BANDS/PX)*PX+PX);}
  const seed=def.id==='core'?555:def.id.length*77+5, R=sRand(seed);
  /* layer 0 — distant twinkling lights / stars */
  const R0=sRand(seed*3+1);
  for(let i=0;i<60;i++){
    const sx=((R0()*W*2)-(camx*.04))%(W+40)-20, sy=R0()*H*.62;
    const tw=.3+0.7*Math.abs(Math.sin(G.t*.03+i));
    CX.globalAlpha=tw*.6;CX.fillStyle=i%5===0?def.platEdge:'#cdd6f0';
    CX.fillRect(sx,sy,R0()<.2?2:1,R0()<.2?2:1);
  }
  CX.globalAlpha=1;
  /* big celestial body with corona */
  const mx=W-180-(camx*.05)%60, my=104;
  CX.shadowColor=def.platEdge;CX.shadowBlur=50;
  CX.fillStyle=hexA(def.platEdge,.14);CX.beginPath();CX.arc(mx,my,72,0,TAU);CX.fill();
  CX.fillStyle=hexA(def.platEdge,.26);CX.beginPath();CX.arc(mx,my,46,0,TAU);CX.fill();
  CX.fillStyle=hexA(def.sky[2],.9);CX.beginPath();CX.arc(mx,my,40,0,TAU);CX.fill();
  CX.shadowBlur=0;
  /* faint banding across the orb */
  CX.globalAlpha=.18;CX.fillStyle=def.platEdge;
  for(let b=0;b<4;b++)CX.fillRect(mx-38,my-26+b*16,76,4);
  CX.globalAlpha=1;
  /* pixel clouds (open-sky stages) */
  if(!['abyss','shadow','core'].includes(def.id))drawPixelClouds(def,camx);
  /* layer 1 — far silhouette ridge with atmospheric haze */
  CX.fillStyle=hexA(def.sky[1],.55);
  for(let i=0;i<22;i++){
    const sx=((i*150)-(camx*.12))%(W+300)-150;
    const hgt=70+((Math.sin(i*5.7+seed)*.5+.5)*150)|0;
    drawSilhouette(def,sx,hgt,1.4);
  }
  /* haze band over far layer */
  const hz=CX.createLinearGradient(0,H*.34,0,H*.7);
  hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(1,hexA(def.sky[1],.5));
  CX.fillStyle=hz;CX.fillRect(0,H*.34,W,H*.36);
  /* unique per-stage midground scene */
  bgScene(def,camx);
  /* layer 2 — mid structures with gradient + flickering windows */
  for(let i=0;i<16;i++){
    const sx=((i*250)-(camx*.34))%(W+500)-250;
    const top=H-200-((i*53+seed)%150), bw=52;
    const sg=CX.createLinearGradient(0,top,0,H);
    sg.addColorStop(0,hexA(def.sky[2],.9));sg.addColorStop(1,'rgba(0,0,0,.85)');
    CX.fillStyle=sg;CX.fillRect(sx,top,bw,H);
    /* edge light */
    CX.fillStyle=hexA(def.platEdge,.5);CX.fillRect(sx,top,bw,2);CX.fillRect(sx,top,2,H-top);
    /* windows flicker */
    for(let wy=top+12;wy<H-30;wy+=30)for(let wx=0;wx<2;wx++){
      const lit=((i*7+wy+wx*13)%5)<3, fl=Math.sin(G.t*.05+i+wy)>(-.2);
      CX.fillStyle=lit&&fl?hexA(def.platEdge,.7):'rgba(0,0,0,.4)';
      CX.fillRect(sx+10+wx*22,wy,9,12);
    }
  }
  /* layer 3 — near silhouette (darkest, fastest) */
  CX.fillStyle='rgba(0,0,0,.6)';
  for(let i=0;i<10;i++){
    const sx=((i*340)-(camx*.6))%(W+680)-340;
    const hgt=120+((Math.sin(i*9.1+seed)*.5+.5)*200)|0;
    drawSilhouette(def,sx,hgt,2.0);
  }
  /* per-stage atmospheric accent */
  bgAccent(def,camx,mx,my);
  /* ambient weather */
  spawnAmbient(def);
  for(let i=ambP.length-1;i>=0;i--){const p=ambP[i];p.x+=p.vx;p.y+=p.vy;p.l--;
    if(p.l<=0||p.y>H+20||p.y<-30||p.x<-30||p.x>W+30){ambP.splice(i,1);continue;}
    const a=p.fade?Math.min(1,p.l/30):1;CX.globalAlpha=a;
    if(p.glow){CX.shadowColor=p.c;CX.shadowBlur=6;}
    CX.fillStyle=p.c;
    if(p.rain)CX.fillRect(p.x,p.y,1.5,11);
    else if(p.gl){CX.globalAlpha=.3;CX.fillRect(p.x,p.y,p.s*4,2);}
    else if(p.circ){CX.beginPath();CX.arc(p.x,p.y,p.s,0,TAU);CX.fill();}
    else CX.fillRect(p.x,p.y,p.s,p.s);
    CX.shadowBlur=0;CX.globalAlpha=1;}
  if(def.amb==='rain'&&Math.random()<.004){flash=5;flashCol='rgba(200,200,255,.25)';}
}
function drawPixelClouds(def,camx){
  const lite=mixHex(def.sky[2],'#ffffff',.65), mid=mixHex(def.sky[2],'#ffffff',.4), shd=mixHex(def.sky[2],'#ffffff',.18);
  const SHAPES=[
    ['.....####.........','...#########..###.','.################.','##################','.################.'],
    ['...###......','.########...','###########.','############','.##########.'],
    ['....####....####...','..###########.####.','.#################..','###################','.#################.']];
  const R=sRand(def.id.length*911+3);
  for(let i=0;i<6;i++){
    const shape=SHAPES[i%3], u=PX*(i%2?3:4);
    const wpx=shape[0].length*u, span=W+wpx+200;
    const cx=(((R()*span)-camx*(.04+i*.01)-G.t*.06*(1+i*.15))%span+span)%span-wpx-100;
    const cy=Math.round((50+R()*130)/PX)*PX, ox=Math.round(cx/PX)*PX;
    shape.forEach((row,ry)=>{CX.fillStyle=ry===shape.length-1?shd:ry===shape.length-2?mid:lite;
      for(let rx=0;rx<row.length;rx++)if(row[rx]==='#')CX.fillRect(ox+rx*u,cy+ry*u,u,u);});
  }
}

function bgScene(def,camx){

    CX.fillStyle=hexA(ed,.8);CX.beginPath();CX.moveTo(vx-26,vy+8);CX.lineTo(vx,vy-6);CX.lineTo(vx+26,vy+8);CX.closePath();CX.fill();

const TILE_STYLE={world:['panel','rail'],axiom:['crystal','crystal'],magma:['cobble','crust'],cryo:['brick','snow'],storm:['panel','rail'],bio:['cobble','grass'],

function getTiles(def){

/* ---------- enemy shot specials ---------- */
function updateEshotSpecials(level){
  for(const s of eshots){
    if(s.vine){s.h=Math.min(s.maxH,s.h+s.grow);s.y=H-48-s.h;
      if(G.t%4===0)spawnP(s.x+rnd(s.w),s.y,rnd(-.5,.5),rnd(-1,0),12,'#5dff7a',2,0,true);}
    if(s.beam&&s.bx){s.x=s.bx.x+s.bx.w/2-10;s.y=s.bx.y+s.bx.h;}
    if(s.bolt&&G.t%2===0)spawnP(s.x+rnd(s.w),s.y+rnd(s.h),rnd(-1,1),0,8,'#fff48a',2,0,true);
  }
  /* player collision */
  if(player&&!player.dead)for(let i=eshots.length-1;i>=0;i--){const s=eshots[i];
    if(aabb(s,player.box)){player.hurt(s.dmg||2);if(!s.beam&&!s.vine&&!s.bolt)eshots.splice(i,1);}}
  /* player shots vs eshots: charged shots clear bullets */
  for(const ps of shots)if(ps.type==='full'||ps.type==='lance')
    for(let i=eshots.length-1;i>=0;i--)if(!eshots[i].beam&&aabb(ps,eshots[i])){burst(eshots[i].x,eshots[i].y,5,'#fff',2);eshots.splice(i,1);}
}

/* ---------- HUD ---------- */
function pixHeart(x,y,u,col){ /* 7x6 pixel heart */
  const rows=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  rows.forEach((r,ry)=>{for(let rx=0;rx<r.length;rx++)if(r[rx]==='#'){
    CX.fillStyle=(ry===1&&rx===1)?'#ffffff':col;CX.fillRect(x+rx*u,y+ry*u,u,u);}});
}
function weaponIcon(id,x,y,sz,on){
  const col=id==='buster'?(CHARS[G.char]||CHARS.VOLT).col:STAGES.find(s=>s.id===id).wcol;
  CX.fillStyle=OUTLINE;CX.fillRect(x-2,y-2,sz+4,sz+4);
  CX.fillStyle=on?'#2b3150':'#151827';CX.fillRect(x,y,sz,sz);
  CX.globalAlpha=on?1:.55;
  const c=x+sz/2, m=y+sz/2, k=id==='buster'?-1:STAGES.findIndex(s=>s.id===id);
  CX.fillStyle=col;
  if(k<0){CX.fillRect(c-6,m-4,12,8);CX.fillStyle='#fff';CX.fillRect(c+2,m-2,4,4);}
  else if(k===0){CX.fillRect(c-8,m+2,16,4);CX.fillRect(c-4,m-4,8,6);}          /* wave */
  else if(k===1){CX.fillRect(c-2,m-8,4,16);CX.fillRect(c-8,m-2,16,4);}          /* shard */
  else if(k===2){CX.fillRect(c-8,m-2,16,4);CX.fillRect(c+4,m-6,4,12);}          /* lance */
  else if(k===3){CX.fillRect(c-6,m-6,4,4);CX.fillRect(c+2,m-6,4,4);CX.fillRect(c-2,m+2,4,4);} /* orbit */
  else if(k===4){CX.fillRect(c-8,m,16,6);CX.fillRect(c-4,m-6,8,6);}            /* tide */
  else if(k===5){CX.fillRect(c-8,m-4,12,2);CX.fillRect(c-4,m+2,12,2);}          /* bolt */
  else if(k===6){for(const [a,b2] of [[-6,-6],[2,-6],[-6,2],[2,2]])CX.fillRect(c+a,m+b2,4,4);} /* rivets */
  else {CX.fillRect(c-8,m+4,16,4);CX.fillRect(c-6,m-2,4,6);CX.fillRect(c+2,m-6,4,10);}       /* quake */
  CX.globalAlpha=1;
}
function hudBar(x,y,w,h,frac,col,segs){

  CX.fillStyle=col;CX.fillRect(x,y,fw,h);
  CX.fillStyle=mixHex(col,'#ffffff',.5);CX.fillRect(x,y,fw,PX);              /* highlight */
  CX.fillStyle=mixHex(col,'#000000',.35);CX.fillRect(x,y+h-PX,fw,PX);       /* shade */
  if(segs>1){CX.fillStyle='rgba(0,0,0,.35)';for(let i=1;i<segs;i++)CX.fillRect(x+Math.round(w*i/segs/PX)*PX,y,PX,h);}

/* ---------- play update ---------- */
function updatePlay(){
  const level=curLevel;
  if(G.cut){updateCut();
    if(level.bossStarted){cam.x=lerp(cam.x,level.arena.x+level.arena.w/2-W/2,.08);cam.x=clamp(cam.x,0,level.w-W);}
    updateParts();return;}
  if(G.armorShow){G.armorShow.t++;updateParts();
    if(G.armorShow.t>45&&(tap('OK')||tap('J')||tap('F'))){G.armorShow=null;SFX.sel();}
    return;}
  if(tap('ESC')){
    if(paused){paused=false;if(G.stage!=='world')enterWorld(G.stage==='axiom'?null:G.stage);return;}
    paused=true;SFX.blip();
  }
  if(tap('OK')){paused=!paused;SFX.blip();}
  if(paused){cycleWeapon();return;}
  if(level.world){updateWorld(level);if(G.state!=='PLAY'||curLevel!==level)return;}
  player.update(level);
  if(level.axiom){updateAxiom(level);if(G.state!=='PLAY')return;}
  /* camera */
  if(!level.bossStarted){
    cam.x=clamp(player.x-W/2+player.w/2,0,level.w-W);
    if(player.x>level.door+30){
      level.bossStarted=true;level.camMin=level.arena.x;
      SFX.door();stopSong();
      boss=new Boss(G.stage,{x:level.arena.x,y:0,w:level.arena.w,h:H});
      enemies=[];eshots=[];startBossDialogue(boss);markSeen('boss:'+G.stage);
    }
  }else cam.x=lerp(cam.x,level.arena.x+level.arena.w/2-W/2,.08),cam.x=clamp(cam.x,0,level.w-W);
  cam.y=0;
  /* 1.1 mini-boss gate */
  const M=level.mini;
  if(M&&M.state==='fight')cam.x=lerp(cam.x,M.x0+450-W/2,.12);
  if(M&&M.state==='idle'&&player.x>M.x0+140&&player.x<M.x1&&!level.bossStarted){M.state='fight';
    level.plats.push({x:M.x0,y:-400,w:26,h:H-48+400,gate:'entry'});
    M.e=new Enemy(M.x1-220,H-48-70,'mini',{col:level.def.platEdge});enemies.push(M.e);
    SFX.door();playSong('boss');
    G.banner={name:M.name,text:'INTRUDER. THIS GATE DOES NOT OPEN FOR YOU.',col:level.def.platEdge,t:0};}
  if(M&&M.state==='fight'&&M.e.dead){M.state='done';level.plats=level.plats.filter(p=>!p.gate);
    G.score=(G.score||0)+1900;playSong(level.def.song);SFX.tank();toast(M.name+' DESTROYED - GATE OPEN');}
  for(const h of level.hints)if(!h.done&&player.x>h.x){h.done=true;toast(h.text);}
  /* enemies */
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    if(Math.abs(e.x-player.x)<W*1.2)e.update(level);
    if(e.dead)enemies.splice(i,1);}
  /* player shots vs enemies */
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];let used=false;
    for(const e of enemies)if(!e.dead&&aabb(s,e.box)){e.hurt(s.dmg);if(!s.pierce&&s.type!=='thorn'&&s.type!=='magma')used=true;break;}
    if(boss&&boss.active&&!boss.dead&&aabb(s,boss.box)){
      boss.hurt(s.dmg,({magma:'magma',frost:'cryo',lance:'storm',thorn:'bio',tide:'abyss',shade:'shadow',rivet:'metal',quake:'sand'})[s.type]||'buster');
      if(!s.pierce&&s.type!=='thorn')used=true;}
    if(used){burst(s.x+s.w/2,s.y+s.h/2,5,s.col,2);shots.splice(i,1);}}
  updateShots(level);
  updateEshotSpecials(level);
  if(boss)boss.update(level);
  updateParts();
}

const fs = require('fs');
const path = require('path');

function normalizeStage(stage, fallbackId = 'mod-void') {
  if (!stage || typeof stage !== 'object') return null;

  const normalized = {
    id: stage.id || fallbackId,
    name: stage.name || 'MOD STAGE',
    boss: stage.boss || 'UNKNOWN BOSS',
    weapon: stage.weapon || 'buster',
    wcol: stage.wcol || '#67f7ff',
    sky: Array.isArray(stage.sky) && stage.sky.length >= 3 ? stage.sky : ['#050814', '#0d1738', '#1d2d67'],
    plat: stage.plat || '#1a2347',
    platEdge: stage.platEdge || '#67f7ff',
    amb: stage.amb || 'glitch',
    song: stage.song || 'world',
    ...stage
  };

  if (!Array.isArray(normalized.sky) || normalized.sky.length < 3) {
    normalized.sky = ['#050814', '#0d1738', '#1d2d67'];
  }

  return normalized;
}

function loadMods() {
  const modsDir = path.join(__dirname, 'mods');
  const manifestPath = path.join(modsDir, 'manifest.json');

  if (!fs.existsSync(modsDir) || !fs.existsSync(manifestPath)) {
    return [];
  }

  try {
    const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
    const entries = Array.isArray(manifest.mods) ? manifest.mods : [];
    const mods = [];

    for (const rel of entries) {
      if (typeof rel !== 'string') continue;

      const filePath = path.resolve(modsDir, rel);
      if (!fs.existsSync(filePath)) continue;

      try {
        const raw = fs.readFileSync(filePath, 'utf8');
        const mod = JSON.parse(raw);
        if (mod && typeof mod === 'object') mods.push(mod);
      } catch (error) {
        console.warn(`Failed to parse mod: ${rel}`, error);
      }
    }

    return mods;
  } catch (error) {
    console.warn('Failed to load mods manifest:', error);
    return [];
  }
}

              if (!window.G) return;
              if (!window.G.memoryLogs) window.G.memoryLogs = [];
              if (window.G.memoryLogs.includes(key)) return;
              window.G.memoryLogs.push(key);
              if (window.toast) window.toast('MEMORY FRAGMENT — ' + String(key).toUpperCase());
              if (memoryTexts[key]) {
                console.log('[AXIOM]', memoryTexts[key]);
              }
            };

            const maybeSeedStageFeatures = () => {
              try {
                const stageKey = window.G && window.G.stage ? String(window.G.stage) : 'global';
                if (!window.G.challengeSeeded[stageKey]) {
                  window.G.challengeSeeded[stageKey] = true;
                  const currentLevel = window.curLevel || window.level || null;
                  if (currentLevel && Array.isArray(currentLevel.items)) {
                    currentLevel.items.push({
                      x: (currentLevel.w || 960) * 0.5 - 60,
                      y: 160,
                      w: 18,
                      h: 18,
                      type: 'memory',
                      label: 'MEMORY',
                      value: 'origin',
                      glow: true
                    });
                    currentLevel.items.push({
                      x: (currentLevel.w || 960) * 0.5 + 60,
                      y: 170,
                      w: 18,
                      h: 18,
                      type: 'challenge',
                      label: 'NODE',
                      value: 'survive-30',
                      glow: true
                    });
                  }
                }
              } catch (error) {
                console.warn('[AXIOM] seed stage failed', error);
              }
            };

            const patchEnemyVariant = () => {
              if (!window.Enemy || window.Enemy.__axiomPatched) return;
              const proto = window.Enemy.prototype;
              const originalHurt = proto.hurt;

              proto.hurt = function (d, source) {
                let damage = Number(d) || 1;
                if (this.variant === 'shield') damage *= 0.45;
                if (this.variant === 'dash') {
                  this.vx *= 1.5;
                }
                if (this.variant === 'glitch' && Math.random() < 0.05) {
                  this.x = Math.max(0, Math.min((window.curLevel && window.curLevel.w) || 960, this.x + (Math.random() < 0.5 ? -32 : 32)));
                }
                if (this.variant === 'mimic' && window.player) {
                  this.x += (window.player.x - this.x) * 0.02;
                  this.y += (window.player.y - this.y) * 0.02;
                }

                const result = originalHurt ? originalHurt.call(this, damage, source) : null;
                if (this.dead) {
                  addCombo(35, 'kill');
                  if (Math.random() < 0.22) addCorruption(8);
                  if (Math.random() < 0.15) unlockMemoryLog('origin');
                }
                return result;
              };

              window.Enemy.__axiomPatched = true;
            };

            const patchPlayer = () => {
              if (!window.Player || window.Player.__axiomPatched) return;
              const originalHurt = window.Player.prototype.hurt;

              window.Player.prototype.hurt = function (d) {
                let damage = Number(d) || 1;
                if (window.G && (window.G.corruption || 0) > 35 && Math.random() < 0.05) {
                  damage += 1;
                }
                const result = originalHurt ? originalHurt.call(this, damage) : null;
                if (window.G && window.G.corruption && this.hp && this.hp > 0) {
                  this.hp = Math.max(1, this.hp - Math.max(0, Math.floor((window.G.corruption || 0) / 50)));
                }
                return result;
              };

              window.Player.__axiomPatched = true;
            };

            patchEnemyVariant();
            patchPlayer();

            let lastRank = window.G.axiomRank || 'C';

            setInterval(() => {
              try {
                if (!window.G) return;
                if (window.G.corruption > 0) applyCorruptionEffects();
                if ((window.G.comboTimer || 0) > 0) {
                  window.G.comboTimer -= 1;
                } else {
                  window.G.combo = Math.max(0, (window.G.combo || 0) - 2);
                }

                const nextRank = getAxiomRank(window.G.combo || 0);
                if (nextRank !== lastRank) {
                  lastRank = nextRank;
                  window.G.axiomRank = nextRank;
                  if (window.toast) window.toast('AXIOM RANK — ' + nextRank);
                }

                maybeSeedStageFeatures();
              } catch (error) {
                console.warn('[AXIOM] runtime tick failed', error);
              }
            }, 140);

            window.fireWeapon = function (p) {
              const result = originalFireWeapon.call(this, p);
              if (window.G && window.G.weapon && window.G.weapon !== 'buster' && (window.G.corruption || 0) > 15) {
                const bonus = Math.min(5, Math.floor((window.G.corruption || 0) / 20));
                if (window.shots && Array.isArray(window.shots)) {
                  for (const shot of window.shots) {
                    if (shot && shot.dmg && shot.type) {
                      shot.dmg += bonus * 0.18;
                    }
                  }
                }
              }
              return result;
            };

            window.cycleWeapon = function () {
              const result = originalCycleWeapon.call(this);
              if (window.G && window.G.weapon) {
                window.G.axiomRank = getAxiomRank(window.G.combo || 0);
              }
              return result;
            };

            if (window.toast) window.toast('AXIOM PROTOCOL — CORRUPTION SYSTEM ONLINE');
          }
        };

        waitForGame();
      })();
    `);
  });
}

function createWindow() {
  const mainWindow = new BrowserWindow({
    width: 1280,
    height: 900,
    minWidth: 1000,
    minHeight: 700,
    backgroundColor: '#070b1a',
    autoHideMenuBar: true,
    title: 'Axiom Protocol',
    webPreferences: {
      contextIsolation: false,
      nodeIntegration: false,
      sandbox: false,
      enableRemoteModule: false
    }
  });

  mainWindow.loadFile(path.join(__dirname, 'Axiom Protocol.html'));
  patchGameRuntime(mainWindow);
  mainWindow.maximize();

  mainWindow.webContents.setWindowOpenHandler(({ url: targetUrl }) => {
    shell.openExternal(targetUrl);
    return { action: 'deny' };
  });

  if (!app.isPackaged) {
    mainWindow.webContents.openDevTools({ mode: 'detach' });
  }
}

app.whenReady().then(() => {
  createWindow();

  app.on('activate', () => {
    if (BrowserWindow.getAllWindows().length === 0) {
      createWindow();
    }
  });
});

app.on('window-all-closed', () => {
  if (process.platform !== 'darwin') {
    app.quit();
  }
});
</script>
</body>
</html>
